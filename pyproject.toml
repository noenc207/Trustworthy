# ============================================================
# Trustworthy Skin Cancer AI Platform — pyproject.toml
# Python 3.12 | PEP 517/518 compliant build configuration
# ============================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ────────────────────────────────────────────────────────────
# Project Metadata
# ────────────────────────────────────────────────────────────
[project]
name            = "trustworthy-skin-cancer-ai"
version         = "0.1.0"
description     = "Production-grade Trustworthy AI Platform for Skin Lesion Analysis"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.12"
authors         = [{ name = "Your Name", email = "your.email@example.com" }]
keywords        = [
    "skin-cancer",
    "deep-learning",
    "trustworthy-ai",
    "uncertainty-estimation",
    "ood-detection",
    "explainable-ai",
    "medical-imaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Repository = "https://github.com/your-username/trustworthy-skin-cancer-ai"
Issues     = "https://github.com/your-username/trustworthy-skin-cancer-ai/issues"

[project.scripts]
skin-ai = "src.cli:main"

# ────────────────────────────────────────────────────────────
# Setuptools — Package Discovery
# ────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ────────────────────────────────────────────────────────────
# Ruff — Linting & Formatting (replaces flake8 + isort + pyupgrade)
# ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length    = 100
src            = ["src", "tests"]
exclude        = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.pyi",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ────────────────────────────────────────────────────────────
# Black — Code Formatter
# ────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py312"]
include        = '\.pyi?$'

# ────────────────────────────────────────────────────────────
# isort — Import Sorting
# ────────────────────────────────────────────────────────────
[tool.isort]
profile             = "black"
line_length         = 100
known_first_party   = ["src"]
skip_glob           = ["*.pyi"]

# ────────────────────────────────────────────────────────────
# MyPy — Static Type Checking
# ────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
warn_return_any        = true
warn_unused_configs    = true
disallow_untyped_defs  = true
plugins                = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "albumentations.*",
    "torch.*",
    "torchvision.*",
    "lightning.*",
    "mlflow.*",
    "wandb.*",
    "hydra.*",
    "omegaconf.*",
    "sklearn.*",
    "onnxruntime.*",
    "gradcam.*",
]
ignore_missing_imports = true

# ────────────────────────────────────────────────────────────
# Pytest — Test Configuration
# ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts       = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require services)",
    "api: API endpoint tests (requires running server)",
    "model: Model inference and training tests (requires GPU or model weights)",
    "slow: Tests that are expected to take a long time",
]

# ────────────────────────────────────────────────────────────
# Coverage
# ────────────────────────────────────────────────────────────
[tool.coverage.run]
source        = ["src"]
omit          = ["*/tests/*", "*/migrations/*", "*/alembic/*"]
branch        = true

[tool.coverage.report]
show_missing  = true
skip_covered  = false
precision     = 2
fail_under    = 70
