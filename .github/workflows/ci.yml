name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ────────────────────────────────────────────────────────
  # Code Quality
  # ────────────────────────────────────────────────────────
  quality:
    name: Code Quality (Ruff + Black + MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install quality tools
        run: |
          pip install ruff black mypy isort

      - name: Run Ruff
        run: ruff check src/ tests/

      - name: Check Black formatting
        run: black --check src/ tests/

      - name: Run MyPy
        run: mypy src/ --ignore-missing-imports

  # ────────────────────────────────────────────────────────
  # Unit Tests
  # ────────────────────────────────────────────────────────
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skinai
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skin_cancer_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=xml -m 'not slow'
        env:
          DATABASE_URL: postgresql+asyncpg://skinai:testpassword@localhost:5432/skin_cancer_ai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key

      - name: Run API tests
        run: pytest tests/api/ -v -m api
        env:
          DATABASE_URL: postgresql+asyncpg://skinai:testpassword@localhost:5432/skin_cancer_ai_test
          SECRET_KEY: test-secret-key

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────
  # Docker Build
  # ────────────────────────────────────────────────────────
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target production -t skin-ai-backend:ci .

      - name: Test health endpoint
        run: |
          docker run -d -p 8000:8000 \
            -e SECRET_KEY=ci-secret \
            -e DATABASE_URL=postgresql+asyncpg://fake:fake@localhost:5432/fake \
            --name skin_ai_test \
            skin-ai-backend:ci || true
          sleep 10
          # Health check would run here in a real CI environment
          docker stop skin_ai_test || true
