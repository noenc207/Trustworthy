# ============================================================
# Alembic Configuration — Trustworthy Skin Cancer AI Platform
# ============================================================
# DO NOT set sqlalchemy.url here.
# The URL is read from the environment at runtime in env.py
# to prevent credentials from being committed to source control.
# ============================================================

[alembic]
# Path to the Alembic migration scripts directory.
script_location = alembic

# Template used when generating new migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug to keep filenames sane.
truncate_slug_length = 40

# Output encoding for migration scripts.
output_encoding = utf-8

# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
