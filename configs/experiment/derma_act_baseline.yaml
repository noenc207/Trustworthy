# @package _global_
defaults:
  - override /dataset: isic2019

model:
  name: derma_act_active_perception
  backbone: resnet50
  num_classes: 7
  active_perception:
    feature_dim: 2048
    hidden_dim: 256
    budget: 3
  self_critique:
    enabled: true
  dynamic_routing:
    enabled: false

training:
  batch_size: 32
  max_epochs: 50
  learning_rate: 1e-4

run_mode: active_inference
